name: Publish signed update automatically
on:
  push:
    branches: [main]
    paths-ignore: ['updates/latest.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are missing; no public installable update will be published yet."
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        if: steps.signing.outputs.enabled == 'true'
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          gradle-version: '8.13'
      - name: Prepare signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/abo-uobidah-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/abo-uobidah-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME="1.0.$VERSION_CODE"
          export VERSION_CODE VERSION_NAME
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease
      - name: Verify APK and calculate fingerprints
        if: steps.signing.outputs.enabled == 'true'
        id: apk
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Abo-Uobidah-TV.apk
          SHA256=$(sha256sum release/Abo-Uobidah-TV.apk | awk '{print $1}')
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release/Abo-Uobidah-TV.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')
          test -n "$SHA256" && test -n "$CERT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: auto-${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" release/Abo-Uobidah-TV.apk \
            --title "Abo Uobidah TV $VERSION_NAME" \
            --notes "Automatic signed update from commit $GITHUB_SHA."
      - name: Update live update manifest
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT_SHA256: ${{ steps.apk.outputs.cert }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          TAG_NAME: auto-${{ github.run_number }}
        shell: bash
        run: |
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/Abo-Uobidah-TV.apk"
          jq -n \
            --arg appName "Abo Uobidah TV" \
            --arg packageName "com.abu3obidah.tv" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg cert "$CERT_SHA256" \
            --arg notes "إصدار تلقائي من GitHub: $VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson minimumSupportedVersionCode 1 \
            '{appName:$appName,packageName:$packageName,versionName:$versionName,versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256,signingCertSha256:$cert,releaseNotes:$notes,minimumSupportedVersionCode:$minimumSupportedVersionCode}' \
            > updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Publish update manifest for $VERSION_NAME"
          git push origin HEAD:main
