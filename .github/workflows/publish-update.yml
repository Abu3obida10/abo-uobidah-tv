name: Publish signed update automatically
on:
  push:
    branches: [main]
    paths-ignore: ['updates/latest.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check signing bundle
        id: signing
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          # GitHub's mobile secret editor may insert line breaks when pasting a long JSON value.
          SIGNING_BUNDLE=$(printf '%s' "$SIGNING_BUNDLE" | tr -d '\r\n\t')
          if [[ -n "$SIGNING_BUNDLE" ]] && jq -e '
            (.keystoreBase64 | type == "string" and length > 0) and
            (.storePassword | type == "string" and length > 0) and
            (.keyAlias | type == "string" and length > 0) and
            (.keyPassword | type == "string" and length > 0)
          ' <<< "$SIGNING_BUNDLE" >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_SIGNING_BUNDLE is missing or invalid; no public installable update will be published."
          fi
      - uses: actions/setup-java@v6
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: steps.signing.outputs.enabled == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        if: steps.signing.outputs.enabled == 'true'
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          gradle-version: '8.13'
      - name: Prepare signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          # Normalize pasted line breaks in the protected JSON secret before parsing.
          SIGNING_BUNDLE=$(printf '%s' "$SIGNING_BUNDLE" | tr -d '\r\n\t')
          KEYSTORE_B64=$(jq -r '.keystoreBase64' <<< "$SIGNING_BUNDLE")
          STORE_PASS=$(jq -r '.storePassword' <<< "$SIGNING_BUNDLE")
          KEY_ALIAS=$(jq -r '.keyAlias' <<< "$SIGNING_BUNDLE")
          KEY_PASS=$(jq -r '.keyPassword' <<< "$SIGNING_BUNDLE")
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/abo-uobidah-release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/abo-uobidah-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME="1.0.$VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease
      - name: Verify APK and calculate fingerprints
        if: steps.signing.outputs.enabled == 'true'
        id: apk
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Abo-Uobidah-TV.apk
          SHA256=$(sha256sum release/Abo-Uobidah-TV.apk | awk '{print $1}')
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release/Abo-Uobidah-TV.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')
          test -n "$SHA256" && test -n "$CERT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: auto-${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" release/Abo-Uobidah-TV.apk \
            --title "Abo Uobidah TV $VERSION_NAME" \
            --notes "Automatic signed update from commit $GITHUB_SHA."
      - name: Update live update manifest
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT_SHA256: ${{ steps.apk.outputs.cert }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          TAG_NAME: auto-${{ github.run_number }}
        shell: bash
        run: |
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/Abo-Uobidah-TV.apk"
          jq -n \
            --arg appName "Abo Uobidah TV" \
            --arg packageName "com.abu3obidah.tv" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg cert "$CERT_SHA256" \
            --arg notes "إصدار تلقائي من GitHub: $VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --argjson minimumSupportedVersionCode 1 \
            '{appName:$appName,packageName:$packageName,versionName:$versionName,versionCode:$versionCode,apkUrl:$apkUrl,sha256:$sha256,signingCertSha256:$cert,releaseNotes:$notes,minimumSupportedVersionCode:$minimumSupportedVersionCode}' \
            > updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "Publish update manifest for $VERSION_NAME"
          git push origin HEAD:main
